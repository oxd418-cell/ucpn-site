# Збирає сайт і публікує на GitHub Pages.
# Запускається: при кожній зміні в main (зокрема коли команда зберігає контент у CMS),
# щоночі одразу після півночі за Києвом (щоб події, дата яких минула, перейшли в «Минулі»),
# і вручну (Actions → Build and deploy → Run workflow).
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 21 * * *"   # 00:05 за Києвом влітку (UTC+3)
    - cron: "5 22 * * *"   # 00:05 за Києвом взимку (UTC+2)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
